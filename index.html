<!DOCTYPE html>
<html>
<head>
    <title>CSS Background and Links</title>

    <style>
        /* Repeated background image */
        body {
            background-image: url("https://mdn.github.io/shared-assets/images/examples/star.png");
            background-repeat: repeat;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        
        h1 {
            color: darkblue;
            font-family: Georgia, serif;
            font-size: 32px;
        }

    
        p {
            color: black;
            font-size: 18px;
            font-style: italic;
        }

        
        .mybox {
            width: 400px;
            height: 250px;
            margin: 20px auto;
            border: 3px solid black;

            background-image: url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600");
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;

            color: white;
            font-size: 24px;
            font-weight: bold;
        }

       
        a:link {
            color: blue;
        }

        
        a:visited {
            color: purple;
        }

        
        a:active {
            color: red;
        }

      
        a:hover {
            color: green;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <h1>CSS Styling Experiment</h1>

    <p>
        This webpage demonstrates background images,
        text styles and link effects.
    </p>

    <h2>Box with Non-Repeated Image</h2>

    <div class="mybox">
        My Image Box
    </div>

    <h2>Different Link Styles</h2>

    <p>
        <a href="https://www.google.com">Google</a>
        <br><br>
        <a href="https://www.wikipedia.org">Wikipedia</a>
    </p>

</body>
</html>
